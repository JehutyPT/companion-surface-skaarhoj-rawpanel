name: Issue readiness audit

# Keeps the `ready-for-agent` label honest. This workflow only ever REMOVES
# the label; it never adds it. Promotion is done by whoever prepares the issue.
#
# - issues edited:  a material body change drops readiness
#                   (toggling task-list checkboxes does not count).
# - issues closed:  the closed issue and every open issue it blocks lose readiness
#                   (dependents need re-preparation once a blocker lands).
# - schedule/manual sweep: any labelled issue that is closed, or has an open
#                   blocker, loses readiness.

on:
  issues:
    types: [edited, closed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

# One run at a time per issue for event runs; sweeps share a single group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # Pull requests also fire some issue events; ignore them.
    if: ${{ !github.event.issue.pull_request }}

    steps:
      - name: Audit ready-for-agent labels
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'ready-for-agent';
            const { owner, repo } = context.repo;
            const removals = [];

            // Treat task-list checkbox toggles, line endings and trailing whitespace
            // (e.g. the final newline `gh issue edit` appends) as no change.
            function normalizeBody(body) {
              return (body || '')
                .replace(/\r\n?/g, '\n')
                .replace(/^(\s*(?:[-*+]|\d+[.)])\s+)\[[ xX]\]/gm, '$1[ ]')
                .replace(/[ \t]+$/gm, '')
                .trim();
            }

            const hasLabel = (issue) =>
              (issue.labels || []).some((l) => (typeof l === 'string' ? l : l.name) === LABEL);

            async function removeLabel(issueNumber, reason) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: LABEL });
                core.info(`#${issueNumber}: removed ${LABEL} (${reason})`);
                removals.push([`#${issueNumber}`, reason]);
              } catch (err) {
                if (err.status === 404) {
                  core.info(`#${issueNumber}: ${LABEL} already absent (${reason})`);
                } else {
                  throw err;
                }
              }
            }

            const listDeps = (issueNumber, kind) =>
              github.paginate(`GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/${kind}`, {
                owner, repo, issue_number: issueNumber, per_page: 100,
              });

            async function onEdited() {
              const issue = context.payload.issue;
              const changes = context.payload.changes || {};

              if (!changes.body) {
                core.info(`#${issue.number}: body unchanged (title or other edit), nothing to do`);
                return;
              }
              if (!hasLabel(issue)) {
                core.info(`#${issue.number}: ${LABEL} not present at edit time, nothing to do`);
                return;
              }
              if (normalizeBody(changes.body.from) === normalizeBody(issue.body)) {
                core.info(`#${issue.number}: only checkbox states changed, readiness preserved`);
                return;
              }

              // Race safety: if the label was (re)applied after this edit, keep it.
              const editedAt = new Date(issue.updated_at);
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const lastLabeled = timeline
                .filter((e) => e.event === 'labeled' && e.label && e.label.name === LABEL)
                .map((e) => new Date(e.created_at))
                .sort((a, b) => b - a)[0];
              if (lastLabeled && lastLabeled > editedAt) {
                core.info(`#${issue.number}: ${LABEL} re-applied at ${lastLabeled.toISOString()} after edit at ${editedAt.toISOString()}, keeping it`);
                return;
              }

              await removeLabel(issue.number, 'body changed materially');
            }

            async function onClosed() {
              const issue = context.payload.issue;

              if (hasLabel(issue)) {
                await removeLabel(issue.number, 'issue closed');
              }

              // Issues this one blocks. Unblocking never promotes; dependents need re-preparation.
              // Dependency edges are left untouched.
              const dependents = await listDeps(issue.number, 'blocking');
              for (const dep of dependents) {
                if (dep.pull_request || dep.state !== 'open' || !hasLabel(dep)) continue;
                await removeLabel(dep.number, `blocker #${issue.number} closed; needs re-preparation`);
              }
            }

            async function sweep() {
              const labelled = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'all', labels: LABEL, per_page: 100,
              });

              for (const issue of labelled) {
                if (issue.pull_request) continue;

                if (issue.state === 'closed') {
                  await removeLabel(issue.number, 'issue is closed');
                  continue;
                }

                const blockers = await listDeps(issue.number, 'blocked_by');
                const open = blockers.filter((b) => b.state === 'open').map((b) => `#${b.number}`);
                if (open.length > 0) {
                  await removeLabel(issue.number, `open blocker(s): ${open.join(', ')}`);
                }
              }
              core.info(`Swept ${labelled.length} issue(s) labelled ${LABEL}`);
            }

            // Write the summary even if a run fails part-way, so partial removals are visible.
            try {
              if (context.eventName === 'issues' && context.payload.action === 'edited') {
                await onEdited();
              } else if (context.eventName === 'issues' && context.payload.action === 'closed') {
                await onClosed();
              } else {
                await sweep();
              }
            } finally {
              core.summary.addHeading('Issue readiness audit', 2);
              if (removals.length === 0) {
                core.summary.addRaw(`No ${LABEL} labels removed.`);
              } else {
                core.summary.addTable([
                  [{ data: 'Issue', header: true }, { data: 'Reason', header: true }],
                  ...removals,
                ]);
              }
              await core.summary.write();
            }
